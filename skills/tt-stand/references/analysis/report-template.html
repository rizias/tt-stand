<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Отчёт</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #242424;
        --card: #ffffff;
        --muted: #526272;
        --line: #d5dee8;
        --accent: #1d4e89;
        --warn: #8a3b12;
        --bad: #8d1d1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101418;
          --fg: #e7eef6;
          --card: #1b232d;
          --muted: #a8b6c4;
          --line: #31404f;
          --accent: #8ec1ff;
          --warn: #ffc089;
          --bad: #ffb4b4;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 'Segoe UI',
          sans-serif;
        overflow-x: hidden;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 17px;
        line-height: 1.3;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 15px;
        line-height: 1.3;
        margin: 12px 0 6px;
      }
      h1,
      h2,
      h3,
      p,
      li,
      td,
      th,
      button {
        overflow-wrap: anywhere;
      }
      .panel,
      .block {
        background: var(--card);
        border: 0;
        padding: 0;
        margin: 8px 0 22px;
        max-width: 100%;
      }
      .stack {
        margin: 0;
        padding-left: 18px;
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
        margin: 4px 0;
      }
      .note {
        color: var(--muted);
        margin: 4px 0;
      }
      .chart-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
      }
      .table-panel {
        grid-column: 1 / -1;
      }
      .peak-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin: 16px 0;
      }
      .peak-card {
        border-left: 3px solid var(--accent);
        padding: 8px 12px;
        background: var(--card);
      }
      .peak-value {
        font-size: 24px;
        margin-top: 4px;
      }
      .diagnostics {
        margin: 10px 0 20px;
        font-size: 13px;
      }
      summary {
        cursor: pointer;
        color: var(--accent);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        align-content: start;
        gap: 3px 12px;
        max-width: 100%;
        height: 64px;
        overflow: auto;
      }
      .legend-item {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        max-width: 100%;
        background: transparent;
        color: var(--fg);
        border: 0;
        padding: 3px 0;
        text-align: left;
        font:
          12px/1.4 'Segoe UI',
          sans-serif;
      }
      .legend-item.off {
        opacity: 0.45;
      }
      .swatch {
        width: 16px;
        height: 3px;
        flex: 0 0 16px;
        margin-top: 7px;
      }
      .swatch.dashed {
        background-size: 6px 3px;
        opacity: 0.6;
      }
      .table-wrap {
        max-width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 6px;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      svg.chart,
      svg.timeline {
        width: 100%;
        height: auto;
        display: block;
        max-width: 100%;
      }
      .series-catalog {
        margin-top: 10px;
        font-size: 12px;
      }
      .numeric {
        white-space: nowrap;
        word-break: normal;
        overflow-wrap: normal;
        text-align: right;
      }
      .report-dialog {
        width: min(94vw, 1500px);
        max-width: 94vw;
        max-height: 90vh;
        overflow: auto;
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--line);
        padding: 20px;
      }
      .report-dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      .report-dialog .series-catalog table {
        min-width: 720px;
      }
      .chart-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        min-height: 86px;
      }
      .chart-controls button,
      .line-panel > button,
      .report-dialog > button {
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
        color: var(--accent);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .range-status {
        flex-basis: 100%;
        margin: 0;
        font-size: 13px;
      }
      .chart-state {
        height: 3em;
        overflow: auto;
        margin: 6px 0;
      }
      .line-panel {
        scroll-margin-top: 20px;
      }
      svg.chart {
        touch-action: pan-y;
        user-select: none;
      }
      .line-panel .plot-host {
        min-height: 380px;
      }
      .line-panel > button {
        margin: 6px 8px 0 0;
      }
      .paged-table {
        max-width: 100%;
        overflow-x: auto;
        margin-top: 8px;
      }
      .paged-table input {
        padding: 8px;
        width: min(100%, 440px);
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--line);
      }
      .paged-table table {
        font-size: 12px;
        margin-top: 8px;
      }
      .paged-table button,
      .table-block > button,
      .series-catalog > button {
        font: inherit;
        color: var(--accent);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .paged-table th button {
        border: 0;
        padding: 0;
        text-align: left;
      }
      .pager {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      .note,
      .status {
        font-size: 12px;
      }
      .table-status {
        margin: 6px 0;
      }
      .axis {
        fill: var(--muted);
        font-size: 12px;
      }
      .tip {
        position: fixed;
        z-index: 5;
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        pointer-events: none;
        overflow-wrap: anywhere;
        max-width: calc(100vw - 16px);
      }
      .lane {
        margin: 8px 0;
        max-width: 100%;
      }
      .lane-label {
        margin-bottom: 4px;
      }
      .track {
        position: relative;
        height: 14px;
        background: var(--line);
        border-radius: 7px;
        max-width: 100%;
      }
      .bar {
        position: absolute;
        top: 0;
        bottom: 0;
        background: var(--accent);
        border-radius: 7px;
        min-width: 2px;
      }
      @media (max-width: 650px) {
        .chart-grid,
        .peak-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .table-panel {
          grid-column: auto;
        }
        main {
          padding: 12px;
        }
      }
      @media (max-width: 360px) {
        h1 {
          font-size: 22px;
        }
        main {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Отчёт</h1>
      <p>Загрузка представления…</p>
    </main>
    <aside id="report-links" hidden>
      <p>Полные данные и таблицы:</p>
      <ul>
        __REPORT_LINKS__
      </ul>
    </aside>
    <script type="application/json" id="report-data">
      __REPORT_DATA__
    </script>
    <script type="module">
      __REPORT_SCRIPT__;
    </script>
  </body>
</html>
